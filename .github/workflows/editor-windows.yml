name: Editor Windows Validation

on:
  push:
    branches: [prototype]
  pull_request:
    branches: [prototype, main]

concurrency:
  group: editor-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-msvc-opengl:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run editor source regressions
        shell: cmd
        run: |
          python Scripts\Tests\EngineBoundaryTests.py
          python Scripts\Tests\RuntimeStagingTests.py
          python Scripts\Tests\EditorArchitectureTests.py
          python Scripts\Tests\EditorPlayRuntimeTests.py
          python Scripts\Tests\EditorAssetInteractionTests.py
          python Scripts\Tests\EditorMilestone3Tests.py
          python Scripts\Tests\EditorMilestone4InspectorTests.py
          python Scripts\Tests\EditorMilestone5Tests.py
          python Scripts\Tests\EditorMilestone6Tests.py
          python Scripts\Tests\EditorMilestone7MaterialTests.py
          python Scripts\Tests\EditorMilestone8Tests.py
          python Scripts\Tests\EditorMilestone9Tests.py
          python Scripts\Tests\EditorMilestone10Tests.py
          python Scripts\Tests\EditorMilestone11Tests.py
          python Scripts\Tests\EditorMilestone12Tests.py
          python Scripts\Tests\EditorMilestone13Tests.py
          python Scripts\Tests\EditorMilestone15Tests.py
          python Scripts\Tests\EditorMilestone18Tests.py
          python Scripts\Tests\EditorGizmoTests.py
          python Scripts\Tests\EditorUiTextureTests.py
          python Scripts\Tests\EditorViewportSceneViewTests.py
          python Scripts\Tests\EditorSceneHierarchyMilestoneTests.py

      - name: Generate OpenGL VS2022 solution
        shell: cmd
        run: GenerateProjects.bat

      - name: Build Editor Release
        shell: cmd
        run: msbuild Build\Generated\PlagC.sln /m /nologo /v:minimal /t:Editor /p:Configuration=Release /p:Platform=x64

      - name: Run short offscreen Editor smoke when WGL is available
        shell: pwsh
        run: |
          $lines = @(& .\Bin\windows-x86_64\Release\Editor.exe --offscreen --renderer opengl --frames 3 --workers 1 --no-audio 2>&1)
          $exitCode = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($exitCode -eq 0) {
              exit 0
          }

          $text = $lines -join "`n"
          if ($text -match 'WGL_ARB_create_context extension required for OpenGL 3\.3') {
              Write-Warning 'GitHub-hosted Windows runner has no usable WGL 3.3 context; native Editor compilation passed, so the GPU smoke is skipped on this runner.'
              exit 0
          }

          exit $exitCode
