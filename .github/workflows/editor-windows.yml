name: Editor Windows Validation

on:
  push:
    branches: [prototype]
  pull_request:
    branches: [prototype, main]

concurrency:
  group: editor-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editor-msvc-opengl:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout pinned dependencies
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Run editor source regressions
        shell: pwsh
        run: |
          $tests = @(
            'EngineBoundaryTests.py',
            'RuntimeStagingTests.py',
            'EditorArchitectureTests.py',
            'EditorPlayRuntimeTests.py',
            'EditorAssetInteractionTests.py',
            'EditorMilestone3Tests.py',
            'EditorMilestone4InspectorTests.py',
            'EditorMilestone5Tests.py',
            'EditorMilestone6Tests.py',
            'EditorMilestone7MaterialTests.py',
            'EditorMilestone8Tests.py',
            'EditorMilestone9Tests.py',
            'EditorMilestone10Tests.py',
            'EditorMilestone11Tests.py',
            'EditorMilestone12Tests.py',
            'EditorMilestone13ContentBrowserTests.py',
            'EditorMilestone14ThumbnailTests.py',
            'EditorMilestone15Tests.py',
            'EditorMilestone16SceneFileTests.py',
            'EditorMilestone17PlayToolbarTests.py',
            'EditorMilestone18Tests.py',
            'EditorMilestone19ConsoleTests.py',
            'EditorMilestone20StatisticsTests.py',
            'EditorMilestone21ToolbarTests.py',
            'EditorMilestone22MenuBarTests.py',
            'EditorMilestone24IconFontTests.py',
            'EditorMilestone25WorkspaceTests.py',
            'EditorMilestone27UndoRedoTests.py',
            'EditorMilestone28DragDropTests.py',
            'EditorMilestone30RenderingQualityTests.py',
            'EditorGizmoTests.py',
            'EditorUiTextureTests.py',
            'EditorViewportSceneViewTests.py',
            'EditorSceneHierarchyMilestoneTests.py'
          )
          foreach ($test in $tests) {
            Write-Host "[Editor Source Regression] $test"
            python (Join-Path 'Scripts\Tests' $test)
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Generate OpenGL VS2022 solution
        shell: cmd
        run: GenerateProjects.bat

      - name: Build Editor Release
        shell: cmd
        run: msbuild Build\Generated\PlagC.sln /m /nologo /v:minimal /t:Editor /p:Configuration=Release /p:Platform=x64

      - name: Run short offscreen Editor smoke when WGL is available
        shell: pwsh
        run: |
          $lines = @(& .\Bin\windows-x86_64\Release\Editor.exe --offscreen --renderer opengl --frames 3 --workers 1 --no-audio 2>&1)
          $exitCode = $LASTEXITCODE
          $lines | ForEach-Object { Write-Host $_ }
          if ($exitCode -eq 0) {
              exit 0
          }

          $text = $lines -join "`n"
          if ($text -match 'WGL_ARB_create_context extension required for OpenGL 3\.3') {
              Write-Warning 'GitHub-hosted Windows runner has no usable WGL 3.3 context; native Editor compilation passed, so the GPU smoke is skipped on this runner.'
              exit 0
          }

          exit $exitCode